name: Sync pr_ready

# Keeps the PR-ready branch (original package name, no fork rebrand) in sync
# with main: every main commit that is NOT rebrand-only gets cherry-picked.
# Commits that conflict (expected for code changes, due to the package rename)
# are skipped and filed as an issue for a human to port by hand.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch pr_ready
        run: git fetch origin pr_ready:refs/remotes/origin/pr_ready

      - name: Mirror non-rebrand commits
        id: sync
        run: |
          chmod +x scripts/sync-pr-ready.sh
          scripts/sync-pr-ready.sh

      - name: File issue on conflicts
        if: steps.sync.outputs.conflicted != ''
        uses: actions/github-script@v7
        with:
          script: |
            const conflicted = `${{ steps.sync.outputs.conflicted }}`;
            const body = [
              'The pr_ready sync skipped commits that conflict with the original package layout.',
              'Please port them by hand from `main`:',
              '',
              ...conflicted.split('\n').filter(Boolean).map(l => `- ${l}`),
              '',
              '_Auto-filed by Sync pr_ready._'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'pr_ready sync needs hand port',
              body,
              labels: ['pr-ready']
            });
