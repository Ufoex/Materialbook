name: Build APK

# Every push to main builds a signed release APK and publishes it as a
# GitHub release (v1.1.<run number>).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'fastlane/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionNameOverride=1.1.${{ github.run_number }}

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out Materialbook-1.1.${{ github.run_number }}.apk \
            app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/keystore.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.${{ github.run_number }} Materialbook-1.1.${{ github.run_number }}.apk \
            --title "Materialbook v1.1.${{ github.run_number }}" \
            --generate-notes --target "${{ github.sha }}"
